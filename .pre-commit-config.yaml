# Pre-commit configuration for aidans-patches
# Run all hooks on all files: pre-commit run --all-files
# Install hooks into git: pre-commit install && pre-commit install --hook-type pre-push

default_install_hook_types:
  - pre-commit
  - pre-push

default_stages:
  - pre-commit

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=2048']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: trailing-whitespace
        exclude: '(\.(so|mpe|mpp|apk|apkm|ttf|png|svg|lock)$|patches-(list|bundle)\.json)'
      - id: end-of-file-fixer
        exclude: '(\.(so|mpe|mpp|apk|apkm|ttf|png|svg|lock)$|patches-(list|bundle)\.json)'
      - id: check-yaml
        args: ['--unsafe']
      - id: check-toml

  - repo: local
    hooks:
      - id: format-check
        name: Format Audit (Prettier, Ruff, ktlint)
        entry: bun scripts/audit.ts format:check
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: lint
        name: Code Quality Lint (Oxlint, Ruff, ktlint)
        entry: bun scripts/audit.ts lint
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: typecheck
        name: Strict Typecheck (Worker tsc, Astro check, apk-lab mypy, Morphe Gradle)
        entry: bun scripts/audit.ts typecheck
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: test
        name: Test Suite Audit (pytest, vitest, bun test, app icons)
        entry: bun scripts/audit.ts test
        language: system
        pass_filenames: false
        stages: [pre-push]
