name: Test & Audit Verification Gate
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main', 'dev', 'next']
  workflow_dispatch:

jobs:
  test:
    name: Test & Build Gate
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache font assets
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/aidans-patches/fonts
          key: emoji-font-${{ hashFiles('.github/scripts/prepare_emoji_font.py') }}
          restore-keys: |
            emoji-font-

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install worker dependencies
        working-directory: worker
        run: bun install --frozen-lockfile

      - name: Install site dependencies
        working-directory: site
        run: bun install --frozen-lockfile
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: 'latest'
          enable-cache: true
          python-version: '3.12'

      - name: Sync apk-lab dependencies
        run: uv sync --locked --project tools/apk-lab

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-linux-android
          components: rustfmt, clippy

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28b
          add-to-path: false

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tools/play-metadata -> tools/play-metadata/target
            extensions/nhl-adblock-native -> extensions/nhl-adblock-native/target
      - name: Cache CMake dependencies
        uses: actions/cache@v6
        with:
          path: |
            extensions/adobescan-pdf-native/build/host/_deps
            extensions/adobescan-pdf-native/build/android-arm64-v8a/_deps
          key: cmake-deps-${{ hashFiles('extensions/adobescan-pdf-native/CMakeLists.txt', 'extensions/adobescan-pdf-native/cmake/*.cmake') }}

      - name: Install system test tools
        run: sudo apt-get update -y && sudo apt-get install -y poppler-utils ninja-build clang-format
      - name: Audit formatting
        run: bun run format:check

      - name: Audit code quality & lint
        run: bun run lint

      - name: Audit types across all stacks
        run: bun run typecheck

      - name: Run all test suites
        env:
          AIDAN_REQUIRE_EXTERNAL_TOOLS: '1'
        run: bun run test
      - name: Build and verify patches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid clean --no-daemon
