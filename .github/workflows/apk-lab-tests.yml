name: Test & Audit Verification Gate
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "dev", "next"]
  workflow_dispatch:

jobs:
  test:
    name: Test & Build Gate
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: "temurin"
          java-version: "21"


      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache font assets
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/aidans-patches/fonts
          key: emoji-font-${{ hashFiles('.github/scripts/prepare_emoji_font.py') }}
          restore-keys: |
            emoji-font-


      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install worker dependencies
        working-directory: worker
        run: bun install --frozen-lockfile

      - name: Install site dependencies
        working-directory: site
        run: bun install --frozen-lockfile
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          python-version: "3.12"

      - name: Sync apk-lab dependencies
        run: uv sync --locked --project tools/apk-lab

      - name: Audit formatting
        run: bun run format:check

      - name: Audit code quality & lint
        run: bun run lint

      - name: Audit types across all stacks
        run: bun run typecheck

      - name: Run all test suites
        run: bun run test
      - name: Build and verify patches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid clean --no-daemon
