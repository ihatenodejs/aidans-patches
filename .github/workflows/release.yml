name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - release/main
      - release/dev
    paths:
      - 'patches/**'
      - 'extensions/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.releaserc'
      - 'tools/asset-prep/**'
      - 'scripts/asset-prep.ts'
      - 'scripts/generate-patches-readme.ts'
      - 'scripts/generate-patches-readme.test.ts'
      - 'scripts/test-fixtures/generate-patches-readme/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/release.yml'

concurrency:
  # Per-target with promote-release.yml: a promotion to a release branch and a
  # release run on that branch serialize, while release/main and release/dev do
  # not starve each other.
  group: release-publication-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  detect-changes:
    name: Detect Release Delta
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust_apk_lab: ${{ steps.filter.outputs.rust_apk_lab }}
      rust_asset_prep: ${{ steps.filter.outputs.rust_asset_prep }}
      rust_play_metadata: ${{ steps.filter.outputs.rust_play_metadata }}
      rust_nhl: ${{ steps.filter.outputs.rust_nhl }}
      native: ${{ steps.filter.outputs.native }}
      is_full_run: ${{ steps.run-type.outputs.is_full_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      # The release branch only ever moves by promotion, so this delta is the
      # set of changes since the previous release tip. Android is not in this
      # list: the published artifact must always build.
      - name: Filter Release Delta
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust_apk_lab:
              - 'tools/apk-lab/**'
            rust_asset_prep:
              - 'tools/asset-prep/**'
            rust_play_metadata:
              - 'tools/play-metadata/**'
            rust_nhl:
              - 'extensions/nhl-adblock-native/**'
            native:
              - 'extensions/adobescan-pdf-native/**'
              - '.clang-format'

      - name: Determine Run Type
        id: run-type
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # A manual dispatch is the full-suite escape hatch.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "is_full_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_full_run=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Verify Pre-Release Gate
    needs: detect-changes
    # workflow_dispatch can select any ref; publication is only ever allowed
    # from the protected release branches.
    if: >-
      needs.detect-changes.result == 'success' &&
      (github.ref == 'refs/heads/release/main' ||
      github.ref == 'refs/heads/release/dev')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache font assets
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/aidans-patches/fonts
          key: emoji-font-e37c7af6-${{ hashFiles('tools/asset-prep/Cargo.toml', 'tools/asset-prep/Cargo.lock', 'tools/asset-prep/src/**', 'tools/asset-prep/vendor/**') }}
          restore-keys: |
            emoji-font-

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-linux-android
          components: rustfmt, clippy

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: false
          link-to-sdk: true

      - name: Configure Android NDK environment
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Install native test tools
        if: needs.detect-changes.outputs.native == 'true' || needs.detect-changes.outputs.is_full_run == 'true'
        timeout-minutes: 5
        run: |
          sudo apt-get update -y -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 poppler-utils ninja-build clang-format

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # The release job publishes from this exact lockfile. Prove it installs
      # in an isolated directory so bun's node_modules stays canonical here.
      - name: Verify release dependency lock
        run: |
          release_deps=$(mktemp -d)
          trap 'rm -rf "$release_deps"' EXIT
          cp package.json package-lock.json "$release_deps"/
          cd "$release_deps"
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tools/play-metadata -> tools/play-metadata/target
            extensions/nhl-adblock-native -> extensions/nhl-adblock-native/target
            tools/asset-prep -> tools/asset-prep/target
            tools/apk-lab -> tools/apk-lab/target

      - name: Select release verification scopes
        id: scopes
        env:
          FULL_RUN: ${{ needs.detect-changes.outputs.is_full_run }}
          APK_LAB: ${{ needs.detect-changes.outputs.rust_apk_lab }}
          ASSET_PREP: ${{ needs.detect-changes.outputs.rust_asset_prep }}
          PLAY_METADATA: ${{ needs.detect-changes.outputs.rust_play_metadata }}
          NHL: ${{ needs.detect-changes.outputs.rust_nhl }}
          NATIVE: ${{ needs.detect-changes.outputs.native }}
        run: |
          set -euo pipefail
          rust=()
          native="$NATIVE"
          if [ "$FULL_RUN" = "true" ]; then
            rust=(rust:apk-lab rust:asset-prep rust:play-metadata rust:nhl-adblock-native)
            native=true
          else
            if [ "$APK_LAB" = "true" ]; then rust+=("rust:apk-lab"); fi
            if [ "$ASSET_PREP" = "true" ]; then rust+=("rust:asset-prep"); fi
            if [ "$PLAY_METADATA" = "true" ]; then rust+=("rust:play-metadata"); fi
            if [ "$NHL" = "true" ]; then rust+=("rust:nhl-adblock-native"); fi
          fi
          printf 'rust=%s\n' "$(IFS=,; echo "${rust[*]}")" >> "$GITHUB_OUTPUT"
          printf 'native=%s\n' "$native" >> "$GITHUB_OUTPUT"

      # Android is always selected: the gate must prove the release artifact
      # builds. Rust and native checks run only for the promotion delta.
      - name: Audit release delta
        env:
          RUST_SCOPES: ${{ steps.scopes.outputs.rust }}
          NATIVE_SELECTED: ${{ steps.scopes.outputs.native }}
          AIDAN_REQUIRE_EXTERNAL_TOOLS: '1'
        run: |
          set -euo pipefail
          args=(--scope android)
          if [ -n "$RUST_SCOPES" ]; then args+=(--scope "$RUST_SCOPES"); fi
          if [ "$NATIVE_SELECTED" = "true" ]; then args+=(--scope native); fi
          bun scripts/audit.ts all "${args[@]}"

  release:
    name: Release
    needs: [verify]
    if: >-
      needs.verify.result == 'success' &&
      (github.ref == 'refs/heads/release/main' ||
      github.ref == 'refs/heads/release/dev')
    outputs:
      new_release_published: ${{ steps.release.outputs.new_release_published }}
    permissions:
      contents: write
      pull-requests: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      # Release commits are created locally and pushed from this job, so the
      # push identity must be a ruleset bypass actor. The dedicated GitHub App
      # provides an individually scoped identity. Add it as a bypass actor on
      # the release branch rulesets and on the verification gate ruleset so
      # the release-driven backmerge to dev is accepted.
      - name: Create release identity token
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token }}

      - name: Setup Java
        uses: actions/setup-java@v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache font assets
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/aidans-patches/fonts
          key: emoji-font-e37c7af6-${{ hashFiles('tools/asset-prep/Cargo.toml', 'tools/asset-prep/Cargo.lock', 'tools/asset-prep/src/**', 'tools/asset-prep/vendor/**') }}
          restore-keys: |
            emoji-font-

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-linux-android

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: false
          link-to-sdk: true

      - name: Configure Android NDK environment
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Publication must use the verified SHA, never a fast-forwarded newer
      # tree. A moved branch fails here so a fresh run verifies the new tip.
      # Release branches are protected so only the release identity (the app
      # token above) may update them, and the concurrency group serializes
      # runs for this ref. This guard rejects movement that already existed,
      # but it does not hold a lock between this read and the release push;
      # any other writer is blocked by branch protection instead.
      - name: Verify triggering revision is still the branch tip
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          # Keep a local branch name for semantic-release, but pin it to the
          # verified SHA instead of following the remote tip.
          git checkout -B "$RELEASE_BRANCH" "$VERIFIED_SHA"
          bun scripts/verify-release-revision.ts \
            --branch "$RELEASE_BRANCH" \
            --sha "$VERIFIED_SHA" \
            --remote origin

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install locked release dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Semantic release runs its own Gradle build command on release branches.
      - name: Reconcile release channel notes
        run: bun scripts/reconcile-release-notes.ts --ref "${{ github.ref_name }}" --remote origin

      # The release push is a machine-generated commit already covered by the
      # Verify Pre-Release Gate, and this job installs root dependencies only.
      # Point Git at an empty hooks directory instead of half-running the
      # pre-push audit in a checkout that cannot satisfy it.
      - name: Disable repository hooks for the automated release push
        run: git config --local core.hooksPath "$(mktemp -d)"

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}
          RELEASE_MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/run-release.ts

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Morphe Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp

  deploy-site:
    name: Deploy Website
    needs: release
    if: github.ref == 'refs/heads/release/main' && needs.release.outputs.new_release_published == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-site.yml
    with:
      # The branch tip now includes semantic-release's release commit. The
      # release tag points at the pre-prepare gitHead, so it would miss the
      # generated CHANGELOG/patches-list changes.
      ref: ${{ github.ref_name }}
    secrets: inherit
  deploy-worker:
    name: Deploy Worker
    needs: release
    if: github.ref == 'refs/heads/release/main' && needs.release.outputs.new_release_published == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-worker.yml
    with:
      # The branch tip now includes semantic-release's release commit. The
      # release tag points at the pre-prepare gitHead, so it would miss the
      # generated CHANGELOG/patches-list changes.
      ref: ${{ github.ref_name }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
