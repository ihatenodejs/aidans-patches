name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths:
      - 'patches/**'
      - 'extensions/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.releaserc'
      - '.github/scripts/prepare_emoji_font.py'
      - '.github/scripts/generate_patches_readme.py'
      - '.github/workflows/release.yml'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: Verify Pre-Release Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache font assets
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/aidans-patches/fonts
          key: emoji-font-${{ hashFiles('.github/scripts/prepare_emoji_font.py') }}
          restore-keys: |
            emoji-font-

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          targets: aarch64-linux-android
          components: rustfmt, clippy

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: false
          link-to-sdk: true

      - name: Configure Android NDK environment
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Install system test tools
        timeout-minutes: 5
        run: |
          sudo apt-get update -y -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 poppler-utils ninja-build clang-format

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Audit android domain
        run: bun scripts/audit.ts all --domain android

      - name: Audit rust domain
        run: bun scripts/audit.ts all --domain rust

      - name: Audit native domain
        env:
          AIDAN_REQUIRE_EXTERNAL_TOOLS: '1'
        run: bun scripts/audit.ts all --domain native

      - name: Build and verify patches
        run: ./gradlew :patches:buildAndroid --no-daemon

  release:
    name: Release
    needs: [verify]
    if: needs.verify.result == 'success'
    outputs:
      new_release_published: ${{ steps.release.outputs.new_release_published }}
    permissions:
      contents: write
      pull-requests: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTOR: ${{ github.actor }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache font assets
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/aidans-patches/fonts
          key: emoji-font-${{ hashFiles('.github/scripts/prepare_emoji_font.py') }}
          restore-keys: |
            emoji-font-


      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          targets: aarch64-linux-android

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: false
          link-to-sdk: true

      - name: Configure Android NDK environment
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Fast-forward to remote ref
        run: |
          PREV_HEAD=$(git rev-parse HEAD)
          git pull --ff-only origin "${{ github.ref_name }}"
          if ! git diff --quiet "$PREV_HEAD" HEAD -- package.json package-lock.json; then
            npm install
          fi

      # Semantic release runs its own Gradle build command on main.
      - name: Release
        uses: cycjimmy/semantic-release-action@v7
        id: release
        with:
          extra_plugins: |
            @semantic-release/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Morphe Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp

  deploy-site:
    name: Deploy Website
    needs: release
    if: github.ref == 'refs/heads/main' && needs.release.outputs.new_release_published == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-site.yml
    secrets: inherit
  deploy-worker:
    name: Deploy Worker
    needs: release
    if: github.ref == 'refs/heads/main' && needs.release.outputs.new_release_published == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-worker.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
