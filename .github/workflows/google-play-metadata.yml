name: Google Play Metadata Enrichment

on:
  schedule:
    - cron: '20 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enrich-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check pending apps needing authenticated version
        id: check-pending
        env:
          WORKER_STATUS_URL: ${{ vars.WORKER_STATUS_URL || 'https://worker.patch.p0ntus.com' }}
        run: |
          set -euo pipefail
          STATUS_JSON=$(curl -fsSL "${WORKER_STATUS_URL}/api/status")
          PACKAGES_NEEDING=$(echo "$STATUS_JSON" | jq -r '[.apps | to_entries[] | select(.value.needsAuthenticatedVersion == true) | {packageName: .key, updatedAt: .value.updatedAt}]')
          COUNT=$(echo "$PACKAGES_NEEDING" | jq 'length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "packages=$PACKAGES_NEEDING" >> "$GITHUB_OUTPUT"
          echo "Found $COUNT package(s) requiring authenticated version resolution."

      - name: Install Rust toolchain
        if: steps.check-pending.outputs.count > 0
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        if: steps.check-pending.outputs.count > 0
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/play-metadata -> tools/play-metadata/target

      - name: Run play-metadata and POST results to Worker
        if: steps.check-pending.outputs.count > 0
        env:
          APKEEP_ACCOUNTS: ${{ secrets.APKEEP_ACCOUNTS }}
          COMPATIBILITY_STATUS_SECRET: ${{ secrets.COMPATIBILITY_STATUS_SECRET }}
          WORKER_STATUS_URL: ${{ vars.WORKER_STATUS_URL || 'https://worker.patch.p0ntus.com' }}
          PENDING_PACKAGES: ${{ steps.check-pending.outputs.packages }}
        run: |
          set -euo pipefail
          if [ -z "${APKEEP_ACCOUNTS:-}" ]; then
            echo "Error: APKEEP_ACCOUNTS secret is missing."
            exit 1
          fi
          if [ -z "${COMPATIBILITY_STATUS_SECRET:-}" ]; then
            echo "Error: COMPATIBILITY_STATUS_SECRET secret is missing."
            exit 1
          fi

          PACKAGES_LIST=$(echo "$PENDING_PACKAGES" | jq -r '[.[].packageName]')
          REQUEST_PAYLOAD=$(jq -n \
            --argjson accs "$APKEEP_ACCOUNTS" \
            --argjson pkgs "$PACKAGES_LIST" \
            '{"accounts": $accs, "packages": $pkgs}')

          cargo build --release --locked --manifest-path tools/play-metadata/Cargo.toml
          HELPER_BIN="tools/play-metadata/target/release/play-metadata"

          METADATA_OUT=$(echo "$REQUEST_PAYLOAD" | "$HELPER_BIN")
          RESULTS=$(echo "$METADATA_OUT" | jq '.results')

          # Merge listingUpdatedAt into each result item
          SUBMISSION_RESULTS=$(jq -n \
            --argjson results "$RESULTS" \
            --argjson pending "$PENDING_PACKAGES" \
            '[$results[] as $res | ($pending[] | select(.packageName == $res.packageName)) as $p | $res + {"listingUpdatedAt": $p.updatedAt}]')

          SUBMISSION_PAYLOAD=$(jq -n --argjson r "$SUBMISSION_RESULTS" '{"results": $r}')

          curl -fsSL -X POST "${WORKER_STATUS_URL}/api/play-metadata" \
            -H "Authorization: Bearer ${COMPATIBILITY_STATUS_SECRET}" \
            -H "Content-Type: application/json" \
            -d "$SUBMISSION_PAYLOAD"

          echo "Successfully enriched metadata."
