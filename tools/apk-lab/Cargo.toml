[package]
name = "apk-lab-migrate"
version = "0.1.0"
edition = "2021"
publish = false
description = "Migration harness for the apk-lab Python oracle and Rust port"

[lib]
name = "apk_lab_migrate"
path = "src/migration/mod.rs"

[[bin]]
name = "apk-lab-migrate"
path = "src/bin/apk-lab-migrate.rs"

[dependencies]
asset-prep = { path = "../asset-prep" }
flate2 = "=1.1.11"
gpapi = "=6.1.0"
png = "0.18.1"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = { version = "1.0.139", features = ["raw_value"] }
sha2 = "0.10.8"
tempfile = "3.15.0"
tokio = { version = "1.43.0", features = ["full"] }
ureq = { version = "=3.5.2", default-features = false, features = ["rustls", "gzip"] }

[patch.crates-io]
turbojpeg-sys = { path = "../asset-prep/vendor/turbojpeg-sys" }
