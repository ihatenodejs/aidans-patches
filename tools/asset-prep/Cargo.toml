[package]
name = "asset-prep"
version = "0.1.0"
edition = "2021"
publish = false
description = "Bounded, Pillow-compatible asset transformation for the APK Lab migration"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["webp"] }
png = "0.18.1"
turbojpeg = { version = "=1.5.1", default-features = false, features = ["cmake"] }

[patch.crates-io]
turbojpeg-sys = { path = "vendor/turbojpeg-sys" }

[dev-dependencies]
flate2 = "=1.1.11"
png = "0.18.1"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
sha2 = "0.10.8"
tempfile = "3.15.0"
