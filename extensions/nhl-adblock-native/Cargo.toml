[package]
name = "nhl-adblock-native"
version = "1.0.0"
edition = "2021"
authors = ["Aidan <aidan@p0ntus.com>"]
license = "WTFPL"
description = "Native adblock engine wrapper for NHL article web blocking"

[lib]
name = "nhladblock"
crate-type = ["cdylib", "rlib"]

[dependencies]
adblock = { version = "=0.13.3", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "css-validation"] }
jni = { version = "=0.21.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
seahash = "4.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false
strip = true
